command: ["streamlit", "run", "app.py", "--server.port", "8000", "--server.address", "0.0.0.0"]

env:
  # Lo inyecta el recurso SQL Warehouse que se añade en los ajustes de la
  # aplicación. 'sql-warehouse' tiene que coincidir exactamente con la clave
  # del recurso, o la variable llega vacía.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # De dónde lee la aplicación. Todo lo que necesita vive en el esquema gold.
  - name: CATALOG
    value: bank_churn
  - name: GOLD_SCHEMA
    value: gold

  # Capacidad de la campaña. Sirve para rotular el resumen ejecutivo.
  - name: CAPACIDAD
    value: "800"

  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
